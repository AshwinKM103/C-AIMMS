[project]
name = "fluxmem"
version = "0.1.0"
description = "ADASTORE: three-tier memory hierarchy, format-adaptive selector, BMM-gated fusion (COLM Section 1.3.2-1.3.3)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "torch>=2.7,<2.9",
    "pydantic>=2.12,<3",
    "scipy>=1.15,<2",
    "PyYAML==6.0.3",
    "faiss-cpu>=1.15.0",
    "spacy>=3.8,<4",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluxmem*", "hetrep*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises real models (spaCy) rather than fakes",
]
