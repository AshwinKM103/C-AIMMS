[project]
name = "fluxmem"
version = "0.1.0"
description = "ADASTORE: three-tier memory hierarchy, format-adaptive selector, BMM-gated fusion (COLM Section 1.3.2-1.3.3)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "torch>=2.7,<2.9",
    "pydantic>=2.12,<3",
    "scipy>=1.15,<2",
    "PyYAML==6.0.3",
    "faiss-cpu>=1.15.0",
    "spacy>=3.8,<4",
    "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.0",
]
hypermem = [
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "openai>=1.0.0",
    "aiohttp>=3.8.0",
    "rank-bm25>=0.2.2",
    "json-repair>=0.28.0",
    "transformers>=4.30.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "wandb>=0.16.0",
]
memocr = [
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "torchdata==0.11.0",
    "xformers==0.0.31",
    "torchao==0.9.0",
    "transformers==4.55.4",
    "tokenizers>=0.21.1",
    "tiktoken==0.11.0",
    "safetensors",
    "einops",
    "accelerate",
    "datasets",
    "peft",
    "tensordict>=0.8.0,<=0.9.1,!=0.9.0",
    "ray[default]>=2.41.0",
    "omegaconf",
    "hydra-core",
    "pyarrow>=19.0.0",
    "pandas",
    "vllm==0.10.1.1",
    "flashinfer-python",
    "sglang==0.4.10.post2",
    "sgl-kernel==0.2.8",
    "wandb",
    "tensorboard",
    "codetiming",
    "dill",
    "decord",
    "liger-kernel",
    "math_verify",
    "latex2sympy2_extended",
    "mathruler",
    "qwen-vl-utils",
    "torch_memory_saver",
    "beautifulsoup4",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
iterret = [
    "langgraph==1.2.5",
    "openai==2.43.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fluxmem*", "hetrep*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises real models (spaCy) rather than fakes",
]
